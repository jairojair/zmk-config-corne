layout: {zmk_keyboard: corne, layout_name: five_column_transform}
layers:
  Base:
  - [Q, W, E, R, T, Y, U, I, O, P]
  - - {t: A, h: GUI}
    - {t: S, h: ALT}
    - {t: D, h: SHIFT}
    - {t: F, h: CTRL}
    - G
    - H
    - {t: J, h: CTRL}
    - {t: K, h: SHIFT}
    - {t: L, h: ALT}
    - {t: ;, h: GUI}
  - [Z, X, C, V, B, N, M, ',', ., /]
  - [TAB, LWR, SPACE, ENTER, RSE, BSPC]
  Lower:
  - ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0']
  - - TAB
    - BT CLR
    - BT 2
    - BT 3
    - BT 4
    - LEFT
    - DOWN
    - UP
    - RIGHT
    - {t: --, type: trans}
  - - VOL-
    - VOL+
    - PREV
    - PLAY
    - NEXT
    - {t: --, type: trans}
    - {t: --, type: trans}
    - {t: --, type: trans}
    - {t: --, type: trans}
    - {t: --, type: trans}
  - - TAB
    - {type: held}
    - SPACE
    - ENTER
    - {t: --, type: trans}
    - BSPC
  Raise:
  - ['!', '@', '#', $, '%', ^, '&', '*', (, )]
  - - {t: --, type: trans}
    - {t: --, type: trans}
    - {t: --, type: trans}
    - {t: --, type: trans}
    - {t: --, type: trans}
    - '-'
    - '='
    - '['
    - ']'
    - \
  - - {t: --, type: trans}
    - {t: --, type: trans}
    - {t: --, type: trans}
    - {t: --, type: trans}
    - {t: --, type: trans}
    - _
    - +
    - '{'
    - '}'
    - '|'
  - - GUI
    - {t: --, type: trans}
    - SPACE
    - ENTER
    - {type: held}
    - RALT
combos:
- p: [1, 2]
  k: ESC
- p: [8, 9]
  k: BSPC
