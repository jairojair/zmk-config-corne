      <rect class="key-empty" x="382" y="276" width="92" height="72" rx="10"/><text class="label" x="428" y="314">--</text>
      <rect class="key" x="486" y="276" width="92" height="72" rx="10"/><text class="label" x="532" y="314">SPC</text>
