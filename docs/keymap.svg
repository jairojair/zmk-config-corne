      <rect class="key" x="1070" y="0" width="92" height="72" rx="10"/><text class="label" x="1116" y="38">0</text>

      <rect class="key-alt" x="0" y="84" width="92" height="72" rx="10"/><text class="label" x="46" y="122">TAB</text>
      <rect class="key-alt" x="104" y="84" width="92" height="72" rx="10"/><text class="small" x="150" y="108">BT</text><text class="label" x="150" y="130">CLR</text>
      <rect class="key-alt" x="208" y="84" width="92" height="72" rx="10"/><text class="small" x="254" y="108">BT</text><text class="label" x="254" y="130">2</text>
      <rect class="key-alt" x="312" y="84" width="92" height="72" rx="10"/><text class="small" x="358" y="108">BT</text><text class="label" x="358" y="130">3</text>
      <rect class="key-alt" x="416" y="84" width="92" height="72" rx="10"/><text class="small" x="462" y="108">BT</text><text class="label" x="462" y="130">4</text>
      <rect class="key" x="654" y="84" width="92" height="72" rx="10"/><text class="label" x="700" y="122">LEFT</text>
      <rect class="key" x="758" y="84" width="92" height="72" rx="10"/><text class="label" x="804" y="122">DOWN</text>
      <rect class="key" x="862" y="84" width="92" height="72" rx="10"/><text class="label" x="908" y="122">UP</text>
      <rect class="key" x="966" y="84" width="92" height="72" rx="10"/><text class="label" x="1012" y="122">RIGHT</text>
      <rect class="key-empty" x="1070" y="84" width="92" height="72" rx="10"/><text class="label" x="1116" y="122">--</text>

      <rect class="key-alt" x="0" y="168" width="92" height="72" rx="10"/><text class="label" x="46" y="206">VOL-</text>
      <rect class="key-alt" x="104" y="168" width="92" height="72" rx="10"/><text class="label" x="150" y="206">VOL+</text>
      <rect class="key-alt" x="208" y="168" width="92" height="72" rx="10"/><text class="label" x="254" y="206">PREV</text>
      <rect class="key-alt" x="312" y="168" width="92" height="72" rx="10"/><text class="label" x="358" y="206">PLAY</text>
      <rect class="key-alt" x="416" y="168" width="92" height="72" rx="10"/><text class="label" x="462" y="206">NEXT</text>
      <rect class="key-empty" x="654" y="168" width="92" height="72" rx="10"/><text class="label" x="700" y="206">--</text>
      <rect class="key-empty" x="758" y="168" width="92" height="72" rx="10"/><text class="label" x="804" y="206">--</text>
      <rect class="key-empty" x="862" y="168" width="92" height="72" rx="10"/><text class="label" x="908" y="206">--</text>
      <rect class="key-empty" x="966" y="168" width="92" height="72" rx="10"/><text class="label" x="1012" y="206">--</text>
      <rect class="key-empty" x="1070" y="168" width="92" height="72" rx="10"/><text class="label" x="1116" y="206">--</text>

