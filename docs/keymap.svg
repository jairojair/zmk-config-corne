      <rect class="key" x="758" y="84" width="92" height="72" rx="10"/><text class="label" x="804" y="122">=</text>
      <rect class="key" x="862" y="84" width="92" height="72" rx="10"/><text class="label" x="908" y="122">[</text>
      <rect class="key" x="966" y="84" width="92" height="72" rx="10"/><text class="label" x="1012" y="122">]</text>
      <rect class="key" x="1070" y="84" width="92" height="72" rx="10"/><text class="label" x="1116" y="122">\</text>

      <rect class="key-empty" x="0" y="168" width="92" height="72" rx="10"/><text class="label" x="46" y="206">--</text>
      <rect class="key-empty" x="104" y="168" width="92" height="72" rx="10"/><text class="label" x="150" y="206">--</text>
      <rect class="key-empty" x="208" y="168" width="92" height="72" rx="10"/><text class="label" x="254" y="206">--</text>
      <rect class="key-empty" x="312" y="168" width="92" height="72" rx="10"/><text class="label" x="358" y="206">--</text>
      <rect class="key-empty" x="416" y="168" width="92" height="72" rx="10"/><text class="label" x="462" y="206">--</text>
      <rect class="key" x="654" y="168" width="92" height="72" rx="10"/><text class="label" x="700" y="206">_</text>
      <rect class="key" x="758" y="168" width="92" height="72" rx="10"/><text class="label" x="804" y="206">+</text>
