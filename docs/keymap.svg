  <g id="raise-layer" transform="translate(55, 1135)">
    <rect class="panel" x="0" y="0" width="1290" height="425" rx="16"/>
    <text class="section" x="34" y="48">Raise</text>
    <text class="note" x="1256" y="48" text-anchor="end">symbols</text>

    <g transform="translate(80, 82)">
      <rect class="key" x="0" y="0" width="92" height="72" rx="10"/><text class="label" x="46" y="38">!</text>
      <rect class="key" x="104" y="0" width="92" height="72" rx="10"/><text class="label" x="150" y="38">@</text>
