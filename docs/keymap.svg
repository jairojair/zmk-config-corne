<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Corne 5x3 ZMK keymap</title>
  <desc id="desc">Visual map of the current base, lower, and raise layers for a Corne 5x3 keyboard.</desc>
  <style>
    :root {
      color-scheme: light;
    }
    .bg { fill: #f6f4ef; }
    .panel { fill: #ffffff; stroke: #d8d2c7; stroke-width: 2; }
    .title { font: 700 34px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #252525; }
    .subtitle { font: 500 17px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #635f57; }
    .section { font: 800 25px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #252525; }
    .note { font: 600 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6d665b; }
    .key { fill: #fdfcf9; stroke: #b9b0a1; stroke-width: 2; }
    .key-alt { fill: #e9f2ff; stroke: #86a9d6; stroke-width: 2; }
    .key-layer { fill: #fff1c7; stroke: #d7a72d; stroke-width: 2; }
    .key-mod { fill: #e8f6ed; stroke: #74aa80; stroke-width: 2; }
    .key-empty { fill: #f3f1eb; stroke: #d8d2c7; stroke-width: 2; stroke-dasharray: 8 7; }
    .key-gap { fill: #fff2ea; stroke: #dc8055; stroke-width: 2; stroke-dasharray: 8 7; }
    .label { font: 800 23px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; text-anchor: middle; dominant-baseline: middle; }
    .small { font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5a5a5a; text-anchor: middle; }
    .combo { fill: #272727; stroke: #272727; stroke-width: 2; }
    .combo-text { font: 800 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
    .legend-text { font: 600 17px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3d3a35; }
  </style>

  <rect class="bg" width="1400" height="1620"/>

  <text class="title" x="70" y="72">Corne Typeractive 5x3 - current layout</text>
  <text class="subtitle" x="70" y="105">Generated as a visual map from config/corne.keymap using the 5-column transform.</text>

  <g transform="translate(70, 135)">
    <rect class="key-mod" x="0" y="0" width="26" height="26" rx="5"/>
    <text class="legend-text" x="38" y="19">home-row mod</text>
    <rect class="key-layer" x="205" y="0" width="26" height="26" rx="5"/>
    <text class="legend-text" x="243" y="19">layer</text>
    <rect class="key-alt" x="350" y="0" width="26" height="26" rx="5"/>
    <text class="legend-text" x="388" y="19">system/media</text>
  </g>

  <g id="base-layer" transform="translate(55, 205)">
    <rect class="panel" x="0" y="0" width="1290" height="425" rx="16"/>
    <text class="section" x="34" y="48">Base</text>
    <text class="note" x="1256" y="48" text-anchor="end">QWERTY + home-row mods</text>

    <g transform="translate(80, 82)">
      <rect class="key" x="0" y="0" width="92" height="72" rx="10"/><text class="label" x="46" y="38">Q</text>
      <rect class="key" x="104" y="0" width="92" height="72" rx="10"/><text class="label" x="150" y="38">W</text>
      <rect class="key" x="208" y="0" width="92" height="72" rx="10"/><text class="label" x="254" y="38">E</text>
      <rect class="key" x="312" y="0" width="92" height="72" rx="10"/><text class="label" x="358" y="38">R</text>
      <rect class="key" x="416" y="0" width="92" height="72" rx="10"/><text class="label" x="462" y="38">T</text>

      <rect class="key" x="654" y="0" width="92" height="72" rx="10"/><text class="label" x="700" y="38">Y</text>
      <rect class="key" x="758" y="0" width="92" height="72" rx="10"/><text class="label" x="804" y="38">U</text>
      <rect class="key" x="862" y="0" width="92" height="72" rx="10"/><text class="label" x="908" y="38">I</text>
      <rect class="key" x="966" y="0" width="92" height="72" rx="10"/><text class="label" x="1012" y="38">O</text>
      <rect class="key" x="1070" y="0" width="92" height="72" rx="10"/><text class="label" x="1116" y="38">P</text>

      <rect class="combo" x="73" y="-30" width="50" height="28" rx="14"/><text class="combo-text" x="98" y="-15">ESC</text>
      <rect class="combo" x="1017" y="-30" width="64" height="28" rx="14"/><text class="combo-text" x="1049" y="-15">BSPC</text>

      <rect class="key-mod" x="0" y="84" width="92" height="72" rx="10"/><text class="small" x="46" y="108">GUI</text><text class="label" x="46" y="130">A</text>
      <rect class="key-mod" x="104" y="84" width="92" height="72" rx="10"/><text class="small" x="150" y="108">ALT</text><text class="label" x="150" y="130">S</text>
      <rect class="key-mod" x="208" y="84" width="92" height="72" rx="10"/><text class="small" x="254" y="108">SHIFT</text><text class="label" x="254" y="130">D</text>
      <rect class="key-mod" x="312" y="84" width="92" height="72" rx="10"/><text class="small" x="358" y="108">CTRL</text><text class="label" x="358" y="130">F</text>
      <rect class="key" x="416" y="84" width="92" height="72" rx="10"/><text class="label" x="462" y="122">G</text>

      <rect class="key" x="654" y="84" width="92" height="72" rx="10"/><text class="label" x="700" y="122">H</text>
      <rect class="key-mod" x="758" y="84" width="92" height="72" rx="10"/><text class="small" x="804" y="108">CTRL</text><text class="label" x="804" y="130">J</text>
      <rect class="key-mod" x="862" y="84" width="92" height="72" rx="10"/><text class="small" x="908" y="108">SHIFT</text><text class="label" x="908" y="130">K</text>
      <rect class="key-mod" x="966" y="84" width="92" height="72" rx="10"/><text class="small" x="1012" y="108">ALT</text><text class="label" x="1012" y="130">L</text>
      <rect class="key-mod" x="1070" y="84" width="92" height="72" rx="10"/><text class="small" x="1116" y="108">GUI</text><text class="label" x="1116" y="130">;</text>

      <rect class="key" x="0" y="168" width="92" height="72" rx="10"/><text class="label" x="46" y="206">Z</text>
      <rect class="key" x="104" y="168" width="92" height="72" rx="10"/><text class="label" x="150" y="206">X</text>
      <rect class="key" x="208" y="168" width="92" height="72" rx="10"/><text class="label" x="254" y="206">C</text>
      <rect class="key" x="312" y="168" width="92" height="72" rx="10"/><text class="label" x="358" y="206">V</text>
      <rect class="key" x="416" y="168" width="92" height="72" rx="10"/><text class="label" x="462" y="206">B</text>

      <rect class="key" x="654" y="168" width="92" height="72" rx="10"/><text class="label" x="700" y="206">N</text>
      <rect class="key" x="758" y="168" width="92" height="72" rx="10"/><text class="label" x="804" y="206">M</text>
      <rect class="key" x="862" y="168" width="92" height="72" rx="10"/><text class="label" x="908" y="206">,</text>
      <rect class="key" x="966" y="168" width="92" height="72" rx="10"/><text class="label" x="1012" y="206">.</text>
      <rect class="key" x="1070" y="168" width="92" height="72" rx="10"/><text class="label" x="1116" y="206">/</text>

      <rect class="key-alt" x="278" y="276" width="92" height="72" rx="10"/><text class="label" x="324" y="314">TAB</text>
      <rect class="key-layer" x="382" y="276" width="92" height="72" rx="10"/><text class="label" x="428" y="314">LWR</text>
      <rect class="key" x="486" y="276" width="92" height="72" rx="10"/><text class="label" x="532" y="314">SPC</text>
      <rect class="key" x="584" y="276" width="92" height="72" rx="10"/><text class="label" x="630" y="314">ENT</text>
      <rect class="key-layer" x="688" y="276" width="92" height="72" rx="10"/><text class="label" x="734" y="314">RSE</text>
      <rect class="key-alt" x="792" y="276" width="92" height="72" rx="10"/><text class="label" x="838" y="314">BSPC</text>
    </g>
  </g>

  <g id="lower-layer" transform="translate(55, 670)">
    <rect class="panel" x="0" y="0" width="1290" height="425" rx="16"/>
    <text class="section" x="34" y="48">Lower</text>
    <text class="note" x="1256" y="48" text-anchor="end">numbers, bluetooth, arrows, and media</text>

    <g transform="translate(80, 82)">
      <rect class="key" x="0" y="0" width="92" height="72" rx="10"/><text class="label" x="46" y="38">1</text>
      <rect class="key" x="104" y="0" width="92" height="72" rx="10"/><text class="label" x="150" y="38">2</text>
