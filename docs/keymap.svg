      <rect class="key" x="416" y="0" width="92" height="72" rx="10"/><text class="label" x="462" y="38">5</text>
      <rect class="key" x="654" y="0" width="92" height="72" rx="10"/><text class="label" x="700" y="38">6</text>
      <rect class="key" x="758" y="0" width="92" height="72" rx="10"/><text class="label" x="804" y="38">7</text>
      <rect class="key" x="862" y="0" width="92" height="72" rx="10"/><text class="label" x="908" y="38">8</text>
