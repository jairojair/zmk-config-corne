name: Draw keymap

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**/*.keymap"
      - "config/**/*.dtsi"
      - "keymap-drawer.config.yaml"
      - ".github/workflows/draw-keymap.yml"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install keymap-drawer
        run: python -m pip install keymap-drawer==0.23.0

      - name: Generate keymap drawing
        run: |
          mkdir -p docs
          keymap -c keymap-drawer.config.yaml parse -c 10 -l Base Lower Raise -z config/corne.keymap -o docs/corne.yaml
          keymap -c keymap-drawer.config.yaml draw docs/corne.yaml -o docs/corne.svg

      - name: Commit generated drawing
        run: |
          if git diff --quiet -- docs/corne.yaml docs/corne.svg; then
            echo "Keymap drawing is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/corne.yaml docs/corne.svg
          git commit -m "Update keymap drawing"
          git push
